name: Tests

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEPS_DIR: /tmp/nvim-deps
      TREE_SITTER_CRYSTAL_REV: 50ca9e6fcfb16a2cbcad59203cfd8ad650e25c49
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          curl -LO https://github.com/neovim/neovim/releases/download/v0.12.2/nvim-linux-x86_64.tar.gz
          tar xzf nvim-linux-x86_64.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Install plenary.nvim
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim.git "$DEPS_DIR/plenary.nvim"

      - name: Compile Crystal TS parser
        run: |
          git init "$DEPS_DIR/tree-sitter-crystal"
          git -C "$DEPS_DIR/tree-sitter-crystal" remote add origin https://github.com/crystal-lang-tools/tree-sitter-crystal.git
          git -C "$DEPS_DIR/tree-sitter-crystal" fetch --depth 1 origin "$TREE_SITTER_CRYSTAL_REV"
          git -C "$DEPS_DIR/tree-sitter-crystal" checkout --detach FETCH_HEAD
          cd "$DEPS_DIR/tree-sitter-crystal"
          gcc -shared -fPIC -o crystal.so src/parser.c src/scanner.c src/unicode.c -I src -O2
          mkdir -p "$HOME/.local/share/nvim/site/parser"
          cp crystal.so "$HOME/.local/share/nvim/site/parser/"

      - name: Run tests
        run: tests/run.sh
        env:
          DEPS_DIR: /tmp/nvim-deps

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes
